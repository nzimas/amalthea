# Direct hardware access only; no sound server, software mixer or conversion.
pcm.hw {
 @args [ CARD DEV SUBDEV ]
 @args.CARD { type string default "0" }
 @args.DEV { type integer default 0 }
 @args.SUBDEV { type integer default -1 }
 type hw
 card $CARD
 device $DEV
 subdevice $SUBDEV
}
ctl.hw {
 @args [ CARD ]
 @args.CARD { type string default "0" }
 type hw
 card $CARD
}
pcm.!default { type hw card 0 device 0 }
ctl.!default { type hw card 0 }

# USB MIDI and external clock use direct hardware too; no sequencer daemon.
rawmidi.hw {
 @args [ CARD DEV SUBDEV ]
 @args.CARD { type string default "0" }
 @args.DEV { type integer default 0 }
 @args.SUBDEV { type integer default -1 }
 type hw
 card $CARD
 device $DEV
 subdevice $SUBDEV
}
